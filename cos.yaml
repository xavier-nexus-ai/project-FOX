# ============================================
# FHL 18-MONTH CUSTOMER LIFECYCLE PLAN
# ============================================
# Source: Rowdie Lang, Meeting 2026-03-06
# Full document: docs/updated-docs/extracted-content.md (Doc 10)
fhl_customer_lifecycle:
  overview: "18-month post-settlement lifecycle plan for Fox Home Loans customers. Designed by Rowdie. Each touchpoint is proactive, outcome-based, and segmented by customer type."
  segmentation_tags:
    customer_type: ["New Purchase", "First Home Buyer (FHB)", "Investor", "Refinancer"]
    employment: ["PAYG", "Self-employed"]
    household: ["Single", "Couple", "Dependants"]
    likely_next_needs: ["Vehicle", "Travel", "Wedding", "Reno/Solar", "Debt consolidation", "Business finance"]
    affiliate_partners: ["Quantum", "Stockland", "FTA/Wardle", "Compass"]
    product: ["Fixed", "Variable", "Split", "Offset", "IO", "OO"]

  consistency_checklist:
    - "Clear reason for the touchpoint (why contacting now)"
    - "Concrete outcome (what was checked/produced/improved before reaching out)"
    - "Simple deliverable (one page or less, plus optional attachments/tools)"
    - "Single CTA dependent on the deliverable"
    - "CRM log entry: status + outcomes + lead score + next trigger"

  tone_guide: "Proactive. Calm, reassuring, personable, protective, helpful. (You are in control. We did the work, here's how things are progressing, you're on the best deal)"

  touchpoints:
    - month: 1
      name: "Welcome + Setup Verified"
      purpose: "Prevent early friction, reduce anxiety, confirm loan functioning as expected"
      internal_actions:
        - "Confirm key dates (moving in, property acquisition, funds usage)"
        - "Confirm first repayment date and expected amount"
        - "Validate offset account active and linked (if applicable)"
        - "Check notes for future finance/partner opportunities"
        - "Check settlement conditions or follow-ups"
      customer_outcome:
        - "Everything set up correctly, we're here to support you"
        - "Access to FFG and asset team"
        - "Refer-a-friend program introduced"
        - "Affiliate partner network access"
        - "Next touchpoint confirmed"
      deliverable: "Phone call + short email/SMS. If no contact: one-pager (Your Loan Setup Snapshot)"
      cta: "Reply to this text or email if you have any questions"
      post_call_outcomes: ["Setup verified", "Issues identified with path to rectify", "FFG introduced", "Refer-a-friend reminded", "Expectations set"]

    - month: 3
      name: "90-Day Confidence Pack (with valuation benchmark)"
      purpose: "Show ongoing value, turn uncertainty into confidence, establish equity tracking benchmark"
      internal_actions:
        - "Valuation benchmark (Cotality - estimate/benchmark, not refinance trigger)"
        - "Equity and buffer baseline"
        - "Quick wins identification"
        - "Next 12 months roadmap"
      deliverable: "1-page PDF: Your Property Position and Loan Health"
      deliverable_content:
        - "Property valuation (Cotality)"
        - "Local growth rate/forecast report"
        - "Equity position baseline (plain English)"
        - "Next milestones and 12-month roadmap"
        - "Calculator link for additional repayment impact"
      modules_by_segment:
        fhb: "First-Year Homeowner Plan - valuation benchmark + cost-to-own baseline"
        investor: "Investor 90-Day File Check - valuation benchmark + rent/expense tracking setup"
        refinancer: "Savings Proof + Equity Baseline - valuation benchmark + refinance results to date"
      cta: "Reply to this text or email if you have any questions"

    - month: 6
      name: "Proactive Pricing Review"
      purpose: "Demonstrate advocacy - we've done the work and checked without you needing to do anything"
      internal_actions:
        - "Run repricing review (per lender policy)"
        - "If unavailable, document eligibility timing and next action date"
      customer_outcome: "If improved: communicate in plain English. If no change: explain why and what we do next."
      deliverable: "Phone call + email/SMS. If no contact: one-pager showing repricing review"
      cta_dual:
        - "Reply if you have any questions"
        - "Everything is ready to finalise, I just need your permission to proceed"
      internal_logging: ["Pricing request submitted/approved/declined", "Rate/discount notes", "Next pricing eligibility date", "One-pager provided"]

    - month: 9
      name: "FFG Momentum and Opportunity Pack (proactive, segmented)"
      purpose: "Anticipate next wave of purchases/needs and position FFG or affiliates as next step"
      golden_rule: "Must NOT feel like lead generation. Must feel like: We prepared options based on what customers like you typically need next."
      packs_ffg:
        new_purchase:
          name: "New Home Momentum Pack"
          scenarios: ["Car upgrade", "Furniture/appliances", "Solar/home upgrades", "Small renos", "Debt consolidation"]
          deliverable: "1-2 page PDF: Planning any home upgrades or purchases this year?"
        fhb:
          name: "First Home Momentum Pack"
          scenarios: ["Car upgrade", "Furniture/appliances", "Solar/home upgrades", "Travel/wedding", "Consolidating high-interest debt"]
          deliverable: "1-2 page PDF: Big purchase coming up? Here are the smartest ways to fund it."
        investor:
          name: "Investor Leverage Pack"
          scenarios: ["Vehicle finance", "Equipment finance", "Business finance", "Consolidation guidance", "Renovation funds"]
          deliverable: "1-2 page PDF: How to fund the next move without boxing in future goals."
        refinancer:
          name: "Refi Savings Accelerator Pack"
          scenarios: ["Consolidate expensive debts", "Refinance car/personal loans", "Fund planned purchases"]
          deliverable: "1-page PDF: Turn your refinance into extra breathing room."
      packs_fhl_equity:
        equity_release:
          name: "Equity Release/Top-Up - Funds For Renovation Pack"
          scenarios: ["Upgrades", "Small renos (non-structural)", "Debt consolidation"]
          deliverable: "1-2 page PDF: Planning any home upgrades or renovations? Here's the smartest way to fund them."
      delivery_mechanics:
        - "Send pack as completed content (not an invitation to talk)"
        - "Simple CTA (call, text or email)"
        - "If reply: route to Options Check workflow"

    - month: 12
      name: "Annual Property and Loan Strategy Review"
      purpose: "Signature annual review - value, strategy, direction, ongoing value delivery"
      internal_actions:
        - "Updated valuation"
        - "Repricing opportunity check (if not achieved at 6 months)"
        - "Highlight equity built"
        - "Review loan structure, customer profile, suitability for refi"
        - "Review progress toward original goal"
        - "Identify next 12-month strategy"
      deliverable: "Annual Property and Loan Strategy Review (2 pages max)"
      deliverable_content:
        - "Updated valuation benchmark + movement since 3 months"
        - "Strategy recommendation (1-2 clear options)"
        - "What we will do next and when"
      cta: "Reply REVIEW to book your annual strategy call"

    - month: 15
      name: "Refinance Pathway"
      purpose: "Provide simple pathway to refinance so 18-month action is fast and easy"
      three_paths:
        - "Pay down faster (offset/extra repayment plan)"
        - "Invest/upgrade (readiness + timing guide)"
        - "Refinance to lower interest, repayments or draw equity"
      deliverable: "1-page Your Options Map (three options with pros/cons, our recommendation)"
      cta: "Reply to this text or email if you have any questions"

    - month: 18
      name: "Action Window"
      purpose: "Only activate when relevant - otherwise it becomes noise"
      triggers:
        - "Fixed expiry approaching (timed window)"
        - "Major market movement that materially impacts them"
        - "Customer goal change"
        - "Lender/product change that creates clear advantage"
      deliverable: "Action Window Plan (recommended action, timeline, checklist)"
      cta: "Reply GO to start the action plan"

