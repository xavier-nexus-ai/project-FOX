    notes: "Directly addresses the monetisation constraint. Building segmented nurture journeys tied to customer lifecycle events and cross-sell triggers."

# ============================================
# IMMERSION FINDINGS
# ============================================
immersion:
  completed: "Yes"
  completed_date: "2026-02-06"

  current_state:
    sales_process_summary: "Highly regimented sales process. 401 leads/month (FFG). 75% contact rate target (65% actual). 95%+ of contacted complete application. 80%+ return docs. ~30% approved. Average commission $2,300. Manual 4-day outbound cadence (not automated). 80%+ of unreached complete online form. 90-day plan for declined customers converts at 20%. Process is STRONG - not the primary gap."

    marketing_channels: "98% organic (primarily SEO-driven website traffic). Google Ads $1,500/month FFG + $1,500/month UMI (FFG net negative ROI). Facebook minimal retargeting (5-year-old creative). Radio considering 3-month push at $7.5K/month. No LinkedIn activity. No YouTube. No lead magnets."

    tech_stack_observations: "Ambition (FFG) has API. Infynity (FHL) has NO API - hopeless. 3CX phone system integrated with Ambition. TypeForm with conditional logic (70% completion rate). Zapier routing leads. UMI has proprietary system built by CTO. CTO is AI-capable software engineer. Considering vibe-coded NextJS websites to replace WordPress."

    team_observations: "Jared RESIGNED - marketing gap. Nathan/Rowdie primary implementation team. Bill = new Head of Growth/Partnerships. Mason = ops manager (UMI). CTO available for tech consultation. Brad = top broker (80% repeat/referral). Team is well-scripted, well-monitored (weekly KPI reviews, Looker Studio dashboards). Nathan eyeballs everyone - doesn't want offshore."

  key_discoveries:
    - finding: "UMI Loans is a third business (lender, not broker) with $28M loans out"
      implication: "Scope is broader than originally understood. Potential cross-sell across THREE businesses (direct clients only)."
    - finding: "49,000 leads/year sent to lead market and never re-engaged"
      implication: "Reactivation + resale could generate $1M/year. Massive quick win."
    - finding: "Sales process is already very strong - 95%+ on-phone conversion"
      implication: "Pre-sales playbook may not be needed as standalone. Pivot to lifecycle/nurture."
    - finding: "Home loans has repricing (3-month), valuation (6-12 month), refinance (18+ month) value-adds"
      implication: "Quarterly touchpoint strategy with real value, not just check-ins."
    - finding: "800+ FFG + 250 FHL referral partners in database but only 3-4 actively referring"
      implication: "Massive referral partner activation opportunity."
    - finding: "Brokers don't need another system - Ambition handles sales"
      implication: "Custom POLR MVP for post-settlement/nurture only. Not replacing LMS."
    - finding: "CTO is AI-capable software engineer building proprietary systems"
      implication: "In-house tech capability exists for POLR MVP maintenance and iteration."
    - finding: "Customer journey documented (Taylor 2.0) with 5-stage lifecycle from settlement to wealth building"
      implication: "Client has already mapped the ideal journey. Our job is to automate and operationalise it."
    - finding: "Beacon on the Hill vision document exists with detailed LTV strategies for all 3 brands"
      implication: "Client has strategic clarity. POLR MVP must align with this vision."
    - finding: "Two detailed ICAs exist (Taylor consumer, Alex commercial) with rich data"
      implication: "Segmentation and personalisation strategy has strong foundations."
    - finding: "Customer care calls generated 41 new inquiries last month without any automation"
      implication: "Automating this with AI could multiply results significantly."

  stakeholder_interviews:
    - name: "Nathan Drew"
      role: "MD / Business Owner"
      key_insights: "MD across Fox and UMI. Bought remaining 50% ~1 year ago. Vision: scalable business not reliant on him producing. Champions AI but worried about team feeling replaced. 'AI handles admin, you handle relationships.' Anti-offshore. Lead market = $1M opportunity. Wants POLR/ecosystem vision long-term."
    - name: "Rowdie Lang"
      role: "Operations & Marketing"
      key_insights: "6 years with Nathan. Swiss army knife. Runs Fox end day-to-day. Tech-comfortable (GHL experience from previous role). Excited about SMS and AI. Managing 15 people. Building internal AI agent system for Fox operations (marketing orchestrator, SEO reporting agent, EDM agent, social agent, strategic intelligence agent, memory agent) plus separate operational function agents (leadership, HR, L&D). Using Claude/Cowork and vibe coding. Strong AI adoption internally — supports case for custom POLR over GHL."
    - name: "Dan Fox"
      role: "Founder (Board level)"
      key_insights: "Founded UMI post-GFC with $300K. Now board-level contributor. Still around UMI. Nathan bought 100% ownership."

  quick_wins_identified:
    - "Lead market reactivation campaign (49K leads/year, SMS-based, 3-month cooling period)"
    - "Facebook ad creative update (5-year-old 'Keep Calm' banner still running)"
    - "Lookalike audiences from successful applications for Meta ads"
    - "Lead market revenue to offset increased ad spend"
    - "Home loans repricing check automation (quarterly)"
    - "Property valuation trigger (6-12 months post-settlement)"
    - "Customer care call list prioritisation via data analysis"
    - "AI content agent to replace Jared's marketing function"
    - "Referral partner warm-up campaign (1,050 in database)"

  risks_identified:
    - risk: "Marketing gap from Jared's departure"
      likelihood: "High (confirmed)"
      impact: "Medium - blogs, EDMs, SEO updates will stall"
      mitigation: "AI content agent could replace. Absorb into existing team member."
    - risk: "Infynity (FHL LMS) has no API"
      likelihood: "Confirmed"
      impact: "Medium - home loans data integration will be manual"
      mitigation: "CSV/PDF export. Build reader to parse into POLR database."
    - risk: "Broker resistance to automation (Adrian, Ryan)"
      likelihood: "Medium"
      impact: "Medium"
      mitigation: "Position as 'AI handles admin, you handle relationships'"
    - risk: "Scope creep - UMI Loans, POLR vision, websites, marketing creates massive scope"
      likelihood: "High"
      impact: "High - could delay core playbook delivery"
      mitigation: "POLR MVP scope defined. Websites are post-playbook."
    - risk: "UMI broker-referred clients restrict cross-sell pool"
      likelihood: "Confirmed"
      impact: "Medium - portion of UMI database cannot receive FFG/FHL cross-sell"
      mitigation: "Clear segmentation in POLR. Tag broker-referred vs direct clients."
    - risk: "Nathan's resistance to offshore/full automation"
      likelihood: "Medium"
      impact: "Low - limits some efficiency options but aligns with brand values"
      mitigation: "Focus on AI augmentation, not replacement. Human-led approach."

