# ============================================
# IDEAL CUSTOMER AVATARS (ICAs)
# ============================================
icas:
  # ============================================
  # 5-PROFILE ICA FRAMEWORK (Updated 2026-03-23)
  # Source: Rowdy's data-driven analysis from FFG settlement dataset
  # Replaces the earlier Taylor/Alex model with 5 behavioural profiles
  # Full detail: docs/updated-docs/fox-finance-group-ica-matrix.docx
  #              docs/updated-docs/fox-finance-group-updated-ica-definitions.docx
  # ============================================
  framework_version: "v2.0 - 5-profile data-driven (2026-03-23)"
  note: "Derived from conservative probabilistic repeat-customer match on settlement dataset. Use as strong directional segmentation logic rather than exact customer-level truth."

  # Journey-based strategy still applies on top of ICA profiles
  journey_based_strategy:
    note: "ICAs map to FHL Purchase Types for cross-sell routing. 1st home buyer stays FHB until buying 2nd property."
    rule: "1st home buyer stays classified as FHB ICA until they buy their 2nd property. Then reclassify as Investor or Upgrader."

  # ICA → FHL Purchase Type Mapping (confirmed by Rowdy 2026-03-16)
  fhl_purchase_type_mapping:
    young_practical_motor: ["First Home Buyer"]
    established_personal_finance: ["New Purchase", "Refinance"]
    prime_convenience_repeat: ["New Purchase", "Refinance", "Investor"]
    business_asset: ["Commercial"]
    prime_vehicle: ["New Purchase", "Refinance", "Investor"]

  # FHL Purchase Type Writing Guidance
  fhl_writing_guidance:
    first_home_buyer: "Explain fundamentals, deposit/LVR basics, up-front costs, pre-approval flow, confidence-building next steps"
    new_purchase: "Focus on readiness, borrowing power, offer/contract timing, pre-approval, reducing friction"
    refinance: "Focus on triggers, what to compare (rate/fees/features), equity/LVR, 'health check' style decision path"
    investor: "Cash flow language, long-term strategy, structure/features, risk management WITHOUT giving advice"
    commercial: "Documentation, timelines, deal structure variables, clear 'what to prepare' checklists"

  # Routing hierarchy (recommended by Rowdy)
  routing_priority:
    - "1. Business Asset Borrower"
    - "2. Prime Vehicle Borrower"
    - "3. Young Practical Motor Borrower"
    - "4. Prime Convenience-Led Repeat Borrower"
    - "5. Established Personal Finance Borrower"

  # Recommended CRM tags per contact
  crm_tags:
    - "Primary ICA"
    - "Age band"
    - "Residential status"
    - "Credit strength"
    - "Likely next finance type"

  profiles:
    young_practical_motor:
      name: "Young Practical Motor Borrower"
      what: "Younger/earlier-stage consumer borrower financing a practical vehicle need with affordability focus"
      app_type: "Consumer"
      loan_type: "Consumer Loan (motor/car)"
      demographics:
        age: "Under 30, 30-39"
        employment: "Full-time, then casual/part-time"
        residential: "Renting or living with parents"
        relationship: "More often single, then de facto"
        dependants: "Low"
      credit_profile: "Mixed to weaker-than-prime. Broader score spread. Repayment-sensitive."
      financial_history: "Light credit file. Usually 0 credit cards, 0 personal loans, 0 existing secured debt."
      messaging_priorities: "Reassurance, affordability, simplicity, speed, confidence"
      likely_next_need: "Another motor loan, or later shift into unsecured personal finance"
      triggers: "Vehicle replacement, budget pressure, household second car, work/travel change"
      fhl_cross_sell: ["First Home Buyer"]
      # Maps to legacy ICA: Taylor (consumer segment)

    established_personal_finance:
      name: "Established Personal Finance Borrower"
      what: "Mainstream consumer borrower using personal/unsecured lending for broader life-stage needs"
      app_type: "Consumer"
      loan_type: "Personal Loan (unsecured)"
      demographics:
        age: "30-59"
        employment: "Mostly full-time"
        residential: "Renting or mortgaged"
        relationship: "Mixed single/married/de facto"
      credit_profile: "Mixed but more stable than early-stage. Mainstream near-prime to solid consumer."
      financial_history: "Moderate footprint. 0-1 credit cards. More likely to hold 1+ personal loan or 1 existing secured loan."
      messaging_priorities: "Flexibility, practicality, trust, broad capability, 'we can help again'"
      likely_next_need: "Another personal loan, debt consolidation, home improvement, planned spending"
      triggers: "Life-stage change, cashflow need, larger planned purchase, debt reshaping"
      fhl_cross_sell: ["New Purchase", "Refinance"]
      # Maps to legacy ICA: Taylor Plus (consolidator/upgrader segment)

    prime_convenience_repeat:
      name: "Prime Convenience-Led Repeat Borrower"
      what: "Stronger-credit, established personal-finance borrower valuing simplicity, speed, and repeat convenience"
      highest_value_ica: true  # Confirmed by Rowdie 2026-03-26. Best ROI: fastest settlement, smoothest experience, easiest to create raving fans. Unsecured $30K+ loans. No third parties involved. Quick turnaround. Decent commission + brokerage fee (lender-funded). Time-efficient for brokers.
      app_type: "Consumer"
      loan_type: "Personal Loan (unsecured, prime tier)"
      demographics:
        age: "30-59"
        employment: "Strongly full-time"
        residential: "Heavily mortgaged, then stable renting"
        relationship: "More often married/de facto"
      credit_profile: "Strongest consumer credit profile. Clearly prime or near-prime."
      financial_history: "Controlled but active. 1 credit card common. 0-1 personal loans. Some secured exposure, well-managed."
      messaging_priorities: "Fast-track, loyalty, ease, tailored support, reduced friction"
      likely_next_need: "Another unsecured/personal loan, fast repeat, low-friction convenience"
      triggers: "Planned spending, speed, convenience, existing relationship, timing-sensitive need"
      fhl_cross_sell: ["New Purchase", "Refinance", "Investor"]

    business_asset:
      name: "Business Asset Borrower"
      what: "Commercially minded, self-employed borrower using asset finance for operations and growth"
      app_type: "Commercial"
      loan_type: "Chattel Mortgage"
      demographics:
        age: "30-59"
        employment: "Overwhelmingly self-employed"
        residential: "Often mortgaged, then renting"
        relationship: "More often married/de facto"
        assets: "Car, equipment, trailer, other business-use"
      credit_profile: "Generally stronger than distressed consumer but more variable. Lite doc/asset-backed logic matters more than pure score."
      financial_history: "Very light personal-loan history. 0 personal loans, 0-1 credit cards. Light recorded household debt relative to business profile."
      messaging_priorities: "Commercial outcomes, tax timing, asset upgrade, growth support, preserve working capital"
      likely_next_need: "Another commercial asset loan, replacement vehicle/equipment, expansion asset"
      triggers: "EOFY, replacement cycle, growth, additional vehicle/equipment, cashflow preservation"
      fhl_cross_sell: ["Commercial"]
      # Maps to legacy ICA: Alex (commercial segment)

    prime_vehicle:
      name: "Prime Vehicle Borrower"
      what: "Stronger-credit, established vehicle borrower expecting smoother, more efficient borrowing experience"
      app_type: "Consumer"
      loan_type: "Consumer Loan (car, prime tier)"
      demographics:
        age: "40-59"
        employment: "Mainly full-time"
        residential: "Mainly mortgaged, then renting"
        relationship: "More often married, then de facto"
      credit_profile: "Stronger than younger motor cohort. Clearly prime tier. Expects certainty and smooth execution."
      financial_history: "More active but controlled. 1 credit card common. 0 personal loans typical. Some secured exposure."
      messaging_priorities: "Ease, certainty, quality of experience, efficient process, trusted relationship"
      likely_next_need: "Another vehicle, upgrade/replacement, or shift into broader personal finance"
      triggers: "Upgrade cycle, replacement timing, household vehicle change, convenience-led borrowing"
      fhl_cross_sell: ["New Purchase", "Refinance", "Investor"]

  # Legacy ICAs retained for reference (rich demographic data still useful)
  legacy_icas:
    note: "Original Taylor/Alex ICAs from early discovery. Rich demographic and psychographic data. The 5-profile framework above is the primary segmentation model going forward."
    taylor:
      name: "Taylor - The Stretched but Solid QLD Borrower"
      maps_to: "young_practical_motor + established_personal_finance"
      demographics:
        age: "30-45 (median birth year 1986)"
        location: "QLD - Sunshine Coast + SEQ/regional postcodes"
        employment: "~81% full-time PAYG, ~11% casual, ~8% part-time"
        income: "Net monthly $4.2K-$7.3K, most common ~$4,333/month"
        housing: "~50% renting, ~25% mortgaged"
        credit: "CRA comp mid-high 600s, median ~686"
      loan_profile:
        amount_range: "$10K-$30K core, tail to $30K-$50K"
      pain_points:
        - "Too many debts and due dates"
        - "Fear of being declined"
        - "Low financial confidence"
        - "Cash-flow pressure"
    alex:
      name: "Alex - The Growing QLD Business Owner"
      maps_to: "business_asset"
      demographics:
        age: "35-50"
        location: "QLD - SEQ (Sunshine Coast, Brisbane, Gold Coast, Toowoomba)"
        business_type: "Self-employed trades, construction, transport, professional services"
      loan_profile:
        amount_range: "$100K-$200K total facilities"
      pain_points:
        - "Lumpy income, lenders don't understand self-employed"
        - "Messy stack of separate loans"
        - "Time-poor"

# ============================================
# CUSTOMER JOURNEY (TAYLOR POST-SETTLEMENT)
# ============================================
customer_journey:
  name: "Taylor 2.0 Post-Settlement Journey"
  core_positioning:
    ffg: "Lifestyle Partner - upgrade lifestyle today with better car, clearer debts, more breathing room"
    fhl: "Wealth & Security Partner - build and protect long-term wealth and security"

  stages:
    - stage: 0
      name: "Just Settled"
      timing: "Week 1-4"
      emotion: "Relieved but nervous - did I do the right thing?"
      ffg_role: "Reframe loan as lifestyle upgrade (safer car, fewer bills, simpler money). Make repayments feel clear and manageable."
      fhl_role: "Soft seed - getting on top of this loan is first step toward future security/home goals"
      touchpoints:
        - "Welcome email (FFG): loan summary, first repayment, tips, one-line FHL intro"
        - "SMS check-in: How's everything feeling with your new loan?"

    - stage: 1
      name: "Stabilise & Enjoy Life Again"
      timing: "Month 1-6"
      emotion: "I can manage this - would like breathing room and to enjoy life"
      ffg_role: "Position as Lifestyle Partner. Help use structure to reduce stress and create room for fun."
      fhl_role: "Introduce FHL as Security Partner. Invite to explore whether home could be 2-5 year goal."
      touchpoints:
        - "Email (FFG): Make Your New Loan Work for Your Lifestyle - budgeting, fun money, avoiding relapse"
        - "Email (FHL via FFG intro): Could a Home Be in Your 2-5 Year Plan? - Home Readiness Check invite"
        - "Optional 15-min Loan Check-Up Call (FFG)"

    - stage: 2
      name: "Lifestyle Under Control to Security Plan"
      timing: "Month 6-24"
      emotion: "I'm on top of things. Could owning a place actually be possible?"
      ffg_role: "Stay go-to for lifestyle finance. Always frame as keeping home goals alive."
      fhl_role: "Turn home dream into concrete security plan - deposit target, debt paydown, borrowing power, timeline."
      touchpoints:
        - "Mini-series (co-branded): Path to Your Place - deposit, debt vs borrowing power, 24-month plan"
        - "Annual Finance Health Check (FFG + FHL)"
        - "Triggered message when FFG loan ~60-80% repaid: what this means for home-buying power"

    - stage: 3
      name: "Get / Upgrade the Home"
      timing: "Year 2-5+"
      emotion: "We're ready. Want stability without feeling broke."
      ffg_role: "Supporting lifestyle finance around the home. Always check against home-loan safety."
      fhl_role: "Lead on home loan strategy, pre-approval, settlement, optimisation."
      touchpoints:
        - "Pre-approval & purchase process (FHL): framed as securing your home base"
        - "Post-settlement series (FHL): offset/redraw, building buffers"
        - "Cross-sell nudges (FFG): car for new commute, modest renos, structured safely"

    - stage: 4
      name: "Security Achieved to Wealth Building"
      timing: "Year 5+"
      emotion: "We're stable. How do we protect this and maybe grow?"
      ffg_role: "Fund lifestyle upgrades inside safe boundaries - aligned with wealth plan."
      fhl_role: "Drive long-term wealth: home loan reviews, refinances, potential investment property."
      touchpoints:
        - "Annual Family Security & Wealth Review (co-branded)"
        - "Segmented campaigns: equity-rich (investment + renos) vs security-focused (extra repayments, buffers)"

