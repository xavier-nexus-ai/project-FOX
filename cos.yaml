    formal_tov_created: "2026-03-05 - tone-of-voice.md v1.0 (16 sections, 568 lines)"

  client_voice_pillars:
    - pillar: "Clear Not Clever"
      description: "Simple, jargon-free language. If a customer needs to re-read it, rewrite it."
    - pillar: "Calm and Reassuring"
      description: "Steady, professional tone. No urgency, no pressure. Finance is stressful enough."
    - pillar: "Empowering Not Controlling"
      description: "Give customers the info they need to feel in charge. We guide, they decide."
    - pillar: "Human and Relatable"
      description: "Real language, real scenarios. Not robotic or corporate."
    - pillar: "Optimistic but Grounded"
      description: "Positive without making promises. Confident without overselling."

  words_to_lean_into:
    - "Guide"
    - "Support"
    - "Clarity"
    - "Options"
    - "Confidence"
    - "Progress"
    - "Next step"
    - "Fit"
    - "Understanding"
    - "Momentum"

  words_to_avoid:
    - "You should (directive/advisory)"
    - "Best deal guaranteed (overpromise)"
    - "Fastest approval in Australia (unsubstantiated)"
    - "Urgency language (Act now, Limited time, Don't miss out)"
    - "Jargon without explanation (LVR, DTI, offset)"

  situational_tones:
    introducing: "Confident and supportive - We're here to help you explore your options"
    application: "Reassuring and clear - Here's exactly what happens next"
    presenting_options: "Balanced and honest - Here's what we found and what it means for you"
    not_possible: "Respectful and solutions-focused - This one didn't work but here's what we can do"

  ultimate_test: "Does this make the customer feel clearer, calmer, and more confident than before they read it?"

  key_characteristics:
    personality_adjectives: ["Advisory", "Guiding", "Trustworthy", "Aspirational but grounded", "Optimistic yet accountable", "Clear Not Clever", "Calm and Reassuring", "Empowering Not Controlling", "Human and Relatable"]
    formality_level: "Semi-formal"
    framework: "StoryBrand - customer as hero, Fox as guide"
    key_phrases_to_use:
      - "We do the heavy lifting and leg work"
      - "Compare 100s of options from 50+ lenders"
      - "This process doesn't impact your credit score or commit you to anything"
      - "You are in control the entire way"
      - "Helping you say yes to the life you want (FFG)"
      - "Guiding you toward long-term wealth and family security (FHL)"
      - "When life doesn't go to plan, we help you get back on track (UMI)"
    forbidden_phrases:
      - "advice (compliance - cannot offer financial advice)"
      - "guarantee/guaranteeing"
      - "financial hardship"
      - "You should"
      - "Best deal guaranteed"
      - "Act now / Limited time / Don't miss out"

  notes: "tone-of-voice.md v1.0 created 2026-03-05 by Tone of Voice Agent. 16 sections, 568 lines. Based on client first draft (received 2026-02-18) + existing samples. Five core pillars. Aligns with Beacon on the Hill voice. Human-led cross-sell approach preferred over explicit sales messaging."

