# ============================================
# CONSTRAINT DIAGNOSIS
# ============================================
constraint:
  primary_pillar: "Monetisation"
  primary_constraint: "Three businesses operate in silos with no unified view of customer relationships. Cross-sell between FFG, FHL, and UMI (direct clients) is manual, inconsistent, and untracked. 49K leads/year sold to lead market and never re-engaged. Post-settlement nurture is basic time-based triggers with no lifecycle scoring."
  primary_evidence:
    - "Three separate systems (Ambition, Infynity, Proprietary UMI) with no data sharing"
    - "No unified customer view across any of the three businesses"
    - "Cross-sell is ad hoc - depends on individual team member initiative"
    - "Internal cross-sell target: 20/month (10 each way) - currently underperforming"
    - "Repeat customers convert at 40-45% vs 5-10% organic - massive untapped value"
    - "Lead market: 49K leads/year generated and sold with zero reactivation ($1M/year potential)"
    - "Referral partner database: 1,050+ businesses but only 3-4 actively referring"
    - "Post-settlement nurture: basic time-based triggers, no lifecycle scoring"
    - "Customer care calls generated 41 new inquiries last month without any automation"
    - "Home loans repricing/valuation services: 'best kept secret' - customers don't know about them"
    - "EDMs sent to ~1K customers get only 2-3 responses due to poor targeting"
    - "UMI broker-referred clients cannot be cross-sold to FFG/FHL - restricts portion of lead pool"
    - "No defined pipeline owner for cross-sell between FFG and FHL (who handles the handoff?)"
    - "FHL lifecycle plan exists on paper (Rowdie) but no automation or CRM tooling to execute it"
    - "Financial wellness positioning (proactive repricing, valuations) is the core differentiator but not systematically delivered"

  secondary_pillar: "Retention"
  secondary_constraint: "Post-settlement lifecycle nurture is the real gap. Current sequence is basic time-based triggers (3 days, 1 month, 6 months, 12 months, 18 months, 2 years, 3 years) with generic messaging. No lifecycle scoring, no value-based triggers, no customer journey alignment."
  secondary_evidence:
    - "Post-settlement nurture assessed as 'all messaging needs to be re-looked at'"
    - "Home loans has repricing (quarterly), valuation (6-12 month), refinance (18+ month) value-adds that aren't systematically delivered"
    - "Automation engagement drops off at 6 months. Open rates fall from 50-75% initial to 15-20%"
    - "No customer dashboard or tools for ongoing engagement"
    - "No lead scoring or opportunity triggers based on lifecycle events"

  tertiary_note: "Pre-sales/conversion is NOT a gap. Sales process is already very strong (95%+ conversion once on phone, 80%+ doc return, 30% approval). The original pre-sales playbook may need to pivot."

  constraint_hypothesis: "The primary revenue opportunity is in monetising the existing database through: (1) lead market reactivation ($1M/year potential), (2) cross-sell automation between all three brands, (3) lifecycle-based nurture with real value triggers, and (4) referral partner activation (1,050 in database, 3-4 active). Secondary priority is redesigning post-settlement nurture from time-based to lifecycle/value-based."

  client_perception:
    what_they_think: "They correctly identify cross-sell, database utilisation, and lifecycle nurture as priorities. Nathan articulated the lead market opportunity clearly ($1M/year)."
    aligned_with_diagnosis: "Yes - strongly aligned"
    education_needed: "No - client is well-aligned. Additional education on POLR MVP scope and implementation approach."

